<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>

  <title>Andys Store</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600&display=swap" rel="stylesheet">

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:'Fredoka', sans-serif;
    }

    body{
      background:#fff0f5;
      overflow-x:hidden;
      color:#444;
    }

    /* BACKGROUND DECOR */
    .bubble{
      position:fixed;
      border-radius:50%;
      background:rgba(255,255,255,0.5);
      animation:float 6s infinite ease-in-out;
      z-index:-1;
    }

    .bubble1{
      width:120px;
      height:120px;
      top:80px;
      left:-20px;
    }

    .bubble2{
      width:80px;
      height:80px;
      right:10px;
      top:250px;
      animation-delay:2s;
    }

    .bubble3{
      width:100px;
      height:100px;
      bottom:100px;
      left:20px;
      animation-delay:1s;
    }

    nav{
      padding:22px;
      text-align:center;
      background:#ffc1da;
      color:white;
      font-size:30px;
      font-weight:600;
      position:sticky;
      top:0;
      z-index:100;
      box-shadow:0 5px 15px rgba(255,182,193,0.5);
    }

    .hero{
      text-align:center;
      padding:50px 20px 30px;
      animation:fade 1s ease;
    }

    .hero h1{
      font-size:42px;
      color:#ff5fa2;
      margin-bottom:10px;
    }

    .hero p{
      color:#777;
      font-size:16px;
    }

    .emoji{
      font-size:30px;
      animation:bounce 2s infinite;
      display:inline-block;
    }

    .menu{
      display:flex;
      flex-direction:column;
      align-items:center;
      gap:30px;
      padding:25px;
    }

    .card{
      width:92%;
      max-width:360px;
      background:white;
      border-radius:30px;
      overflow:hidden;
      box-shadow:0 10px 25px rgba(255,182,193,0.4);
      transition:0.4s;
      animation:up 1s ease;
      position:relative;
    }

    .card:hover{
      transform:translateY(-10px) scale(1.02);
    }

    .card::before{
      content:"❤";
      position:absolute;
      top:15px;
      right:18px;
      font-size:22px;
      color:#ff6fae;
      animation:pulse 1.5s infinite;
    }

    .card img{
      width:100%;
      height:240px;
      object-fit:cover;
    }

    .content{
      padding:22px;
      text-align:center;
    }

    .content h2{
      color:#ff5fa2;
      margin-bottom:8px;
      font-size:28px;
    }

    .price{
      color:#ff87b7;
      font-size:20px;
      margin-bottom:15px;
    }

    .btn{
      width:100%;
      padding:14px;
      border:none;
      border-radius:16px;
      background:linear-gradient(45deg,#ff8dc7,#ffb6d9);
      color:white;
      font-size:16px;
      cursor:pointer;
      transition:0.3s;
    }

    .btn:hover{
      transform:scale(1.05);
    }

    footer{
      text-align:center;
      padding:25px;
      color:#888;
      font-size:14px;
    }

    /* ANIMATION */
    @keyframes fade{
      from{
        opacity:0;
        transform:translateY(-20px);
      }
      to{
        opacity:1;
        transform:translateY(0);
      }
    }

    @keyframes up{
      from{
        opacity:0;
        transform:translateY(30px);
      }
      to{
        opacity:1;
        transform:translateY(0);
      }
    }

    @keyframes float{
      0%{
        transform:translateY(0px);
      }
      50%{
        transform:translateY(-20px);
      }
      100%{
        transform:translateY(0px);
      }
    }

    @keyframes bounce{
      0%,100%{
        transform:translateY(0);
      }
      50%{
        transform:translateY(-8px);
      }
    }

    @keyframes pulse{
      0%{
        transform:scale(1);
      }
      50%{
        transform:scale(1.2);
      }
      100%{
        transform:scale(1);
      }
    }

  </style>
</head>

<body>

  <!-- DECOR -->
  <div class="bubble bubble1"></div>
  <div class="bubble bubble2"></div>
  <div class="bubble bubble3"></div>

  <!-- NAVBAR -->
  <nav>
    Andys Store 🍰🍔
  </nav>

  <!-- HERO -->
  <section class="hero">
    <div class="emoji">🧁✨💕</div>

    <h1>Cute American Food</h1>

    <p>
      Sweet • Modern • Aesthetic
    </p>
  </section>

  <!-- MENU -->
  <section class="menu">

    <!-- BURGER -->
    <div class="card">

      <img src="https://images.unsplash.com/photo-1568901346375-23c9450c58cd?q=80&w=1200&auto=format&fit=crop">

      <div class="content">
        <h2>Burger 🍔</h2>

        <p class="price">$8</p>

        <button class="btn">Order Now</button>
      </div>
    </div>

    <!-- CHEESECAKE -->
    <div class="card">

      <img src="https://images.unsplash.com/photo-1533134242443-d4fd215305ad?q=80&w=1200&auto=format&fit=crop">

      <div class="content">
        <h2>Cheese Cake 🍰</h2>

        <p class="price">$6</p>

        <button class="btn">Order Now</button>
      </div>
    </div>

  </section>

  <footer>
    Made with 💕 by Andys Store
  </footer>

</body>
</html>
