<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Andys Store</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:'Poppins', sans-serif;
    }

    body{
      background:#fff8f3;
      color:#333;
    }

    nav{
      background:white;
      padding:18px;
      text-align:center;
      font-size:28px;
      font-weight:700;
      color:#ff7a00;
      box-shadow:0 3px 15px rgba(0,0,0,0.08);
      position:sticky;
      top:0;
    }

    .hero{
      text-align:center;
      padding:40px 20px;
      animation:fade 1s ease;
    }

    .hero h1{
      font-size:38px;
      margin-bottom:10px;
    }

    .hero span{
      color:#ff7a00;
    }

    .hero p{
      color:#777;
      font-size:15px;
    }

    .menu{
      display:flex;
      flex-direction:column;
      align-items:center;
      gap:25px;
      padding:20px;
    }

    .card{
      width:90%;
      max-width:320px;
      background:white;
      border-radius:25px;
      overflow:hidden;
      box-shadow:0 5px 20px rgba(0,0,0,0.08);
      transition:0.3s;
      animation:up 0.8s ease;
    }

    .card:hover{
      transform:translateY(-8px);
    }

    .card img{
      width:100%;
      height:220px;
      object-fit:cover;
    }

    .content{
      padding:20px;
      text-align:center;
    }

    .content h2{
      margin-bottom:8px;
      font-size:25px;
    }

    .price{
      color:#ff7a00;
      font-weight:600;
      margin-bottom:15px;
    }

    button{
      border:none;
      background:#ff7a00;
      color:white;
      padding:12px 20px;
      border-radius:14px;
      cursor:pointer;
      transition:0.3s;
      font-size:15px;
    }

    button:hover{
      background:#ff9500;
      transform:scale(1.05);
    }

    footer{
      text-align:center;
      padding:20px;
      margin-top:20px;
      background:#222;
      color:white;
    }

    @keyframes fade{
      from{
        opacity:0;
        transform:translateY(-20px);
      }
      to{
        opacity:1;
        transform:translateY(0);
      }
    }

    @keyframes up{
      from{
        opacity:0;
        transform:translateY(20px);
      }
      to{
        opacity:1;
        transform:translateY(0);
      }
    }
  </style>
</head>

<body>

  <nav>Andys Store 🍔</nav>

  <section class="hero">
    <h1>Modern <span>Food Menu</span></h1>
    <p>Burger dan dessert favorit ala Amerika</p>
  </section>

  <section class="menu">

    <div class="card">
      <img src="https://images.unsplash.com/photo-1568901346375-23c9450c58cd?q=80&w=1200&auto=format&fit=crop">

      <div class="content">
        <h2>Burger</h2>
        <p class="price">$8</p>

        <button>Order Now</button>
      </div>
    </div>

    <div class="card">
      <img src="https://images.unsplash.com/photo-1533134242443-d4fd215305ad?q=80&w=1200&auto=format&fit=crop">

      <div class="content">
        <h2>Cheese Cake</h2>
        <p class="price">$6</p>

        <button>Order Now</button>
      </div>
    </div>

  </section>

  <footer>
    © 2026 Andys Store
  </footer>

</body>
</html>
