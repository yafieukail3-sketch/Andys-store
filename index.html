<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>

  <title>Andys Store</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:'Poppins', sans-serif;
    }

    body{
      background:#fff8f3;
      color:#333;
    }

    /* NAVBAR */
    nav{
      width:100%;
      padding:18px;
      background:white;
      position:sticky;
      top:0;
      z-index:100;
      text-align:center;
      box-shadow:0 3px 15px rgba(0,0,0,0.08);
    }

    nav h1{
      color:#ff7a00;
      font-size:28px;
    }

    /* HERO */
    .hero{
      min-height:40vh;
      display:flex;
      flex-direction:column;
      justify-content:center;
      align-items:center;
      text-align:center;
      padding:30px 20px;
      animation:fade 1s ease;
    }

    .hero h2{
      font-size:40px;
      line-height:1.2;
      margin-bottom:10px;
    }

    .hero span{
      color:#ff7a00;
    }

    .hero p{
      color:#777;
      font-size:15px;
    }

    /* MENU */
    .menu{
      width:100%;
      display:flex;
      flex-direction:column;
      align-items:center;
      gap:25px;
      padding:20px;
    }

    .card{
      width:100%;
      max-width:360px;
      background:white;
      border-radius:28px;
      overflow:hidden;
      box-shadow:0 5px 20px rgba(0,0,0,0.08);
      animation:up 1s ease;
      transition:0.3s;
    }

    .card:hover{
      transform:translateY(-8px);
    }

    .card img{
      width:100%;
      height:240px;
      object-fit:cover;
    }

    .content{
      padding:22px;
      text-align:center;
    }

    .content h3{
      font-size:28px;
      margin-bottom:8px;
    }

    .price{
      color:#ff7a00;
      font-size:20px;
      font-weight:600;
      margin-bottom:15px;
    }

    .btn{
      width:100%;
      border:none;
      background:#ff7a00;
      color:white;
      padding:14px;
      border-radius:15px;
      font-size:16px;
      cursor:pointer;
      transition:0.3s;
    }

    .btn:hover{
      background:#ff9500;
      transform:scale(1.02);
    }

    footer{
      text-align:center;
      padding:20px;
      margin-top:20px;
      background:#222;
      color:white;
      font-size:14px;
    }

    /* ANIMASI */
    @keyframes fade{
      from{
        opacity:0;
        transform:translateY(-20px);
      }
      to{
        opacity:1;
        transform:translateY(0);
      }
    }

    @keyframes up{
      from{
        opacity:0;
        transform:translateY(30px);
      }
      to{
        opacity:1;
        transform:translateY(0);
      }
    }

  </style>
</head>

<body>

  <!-- NAVBAR -->
  <nav>
    <h1>Andys Store 🍔</h1>
  </nav>

  <!-- HERO -->
  <section class="hero">
    <h2>Modern <span>American Food</span></h2>
    <p>Simple • Cute • Modern</p>
  </section>

  <!-- MENU -->
  <section class="menu">

    <!-- BURGER -->
    <div class="card">
      <img src="https://images.unsplash.com/photo-1568901346375-23c9450c58cd?q=80&w=1200&auto=format&fit=crop">

      <div class="content">
        <h3>Burger</h3>
        <p class="price">$8</p>

        <button class="btn">Order Now</button>
      </div>
    </div>

    <!-- CHEESECAKE -->
    <div class="card">
      <img src="https://images.unsplash.com/photo-1533134242443-d4fd215305ad?q=80&w=1200&auto=format&fit=crop">

      <div class="content">
        <h3>Cheese Cake</h3>
        <p class="price">$6</p>

        <button class="btn">Order Now</button>
      </div>
    </div>

  </section>

  <footer>
    © 2026 Andys Store
  </footer>

</body>
</html>
