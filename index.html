<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Andys Store</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:'Poppins', sans-serif;
    }

    body{
      background:#fff8f3;
      color:#333;
    }

    nav{
      width:100%;
      padding:18px 30px;
      background:white;
      display:flex;
      justify-content:space-between;
      align-items:center;
      box-shadow:0 2px 15px rgba(0,0,0,0.08);
      position:sticky;
      top:0;
    }

    nav h1{
      color:#ff7a00;
      font-size:28px;
    }

    nav button{
      border:none;
      background:#ff7a00;
      color:white;
      padding:10px 18px;
      border-radius:12px;
      cursor:pointer;
      transition:0.3s;
    }

    nav button:hover{
      transform:scale(1.05);
    }

    .hero{
      text-align:center;
      padding:70px 20px 40px;
      animation:fade 1s ease;
    }

    .hero h2{
      font-size:45px;
      margin-bottom:10px;
    }

    .hero span{
      color:#ff7a00;
    }

    .hero p{
      color:#777;
    }

    .menu-title{
      text-align:center;
      margin-top:20px;
      font-size:30px;
      color:#ff7a00;
    }

    .menu{
      display:flex;
      justify-content:center;
      gap:25px;
      flex-wrap:wrap;
      padding:40px 20px;
    }

    .card{
      background:white;
      width:240px;
      border-radius:22px;
      overflow:hidden;
      box-shadow:0 5px 20px rgba(0,0,0,0.08);
      transition:0.35s;
      animation:up 0.8s ease;
    }

    .card:hover{
      transform:translateY(-10px) scale(1.03);
    }

    .card img{
      width:100%;
      height:180px;
      object-fit:cover;
    }

    .card-content{
      padding:18px;
      text-align:center;
    }

    .card-content h3{
      margin-bottom:8px;
      font-size:22px;
    }

    .price{
      color:#ff7a00;
      font-weight:600;
      margin-bottom:15px;
    }

    .order-btn{
      border:none;
      background:#ff7a00;
      color:white;
      padding:10px 18px;
      border-radius:12px;
      cursor:pointer;
      transition:0.3s;
    }

    .order-btn:hover{
      background:#ff9500;
      transform:scale(1.05);
    }

    footer{
      margin-top:40px;
      text-align:center;
      padding:20px;
      background:#222;
      color:white;
    }

    @keyframes fade{
      from{
        opacity:0;
        transform:translateY(-20px);
      }
      to{
        opacity:1;
        transform:translateY(0);
      }
    }

    @keyframes up{
      from{
        opacity:0;
        transform:translateY(30px);
      }
      to{
        opacity:1;
        transform:translateY(0);
      }
    }
  </style>
</head>

<body>

  <nav>
    <h1>Andys Store 🍔</h1>
    <button>Order Now</button>
  </nav>

  <section class="hero">
    <h2>Simple & <span>Modern Food</span></h2>
    <p>Burger dan dessert favorit ala Amerika</p>
  </section>

  <h2 class="menu-title">Our Menu</h2>

  <section class="menu">

    <div class="card">
      <img src="https://images.unsplash.com/photo-1568901346375-23c9450c58cd?q=80&w=1200&auto=format&fit=crop">

      <div class="card-content">
        <h3>Burger</h3>
        <p class="price">$8</p>
        <button class="order-btn">Order</button>
      </div>
    </div>

    <div class="card">
      <img src="https://images.unsplash.com/photo-1533134242443-d4fd215305ad?q=80&w=1200&auto=format&fit=crop">

      <div class="card-content">
        <h3>Cheese Cake</h3>
        <p class="price">$6</p>
        <button class="order-btn">Order</button>
      </div>
    </div>

  </section>

  <footer>
    © 2026 Andys Store
  </footer>

</body>
</html>
